repos:
  - repo: local
    hooks:
      - id: lint-imports
        name: features/ 직접 import 금지 검사
        entry: python tools/lint_imports.py
        language: python
        types: [python]
        pass_filenames: false

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.10
        args: ["--line-length=100"]

  - repo: local
    hooks:
      - id: pytest-smoke
        name: 스모크 테스트
        entry: python -m pytest tests/ -x -q
        language: python
        types: [python]
        pass_filenames: false
